services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATA_DIR=/data
    volumes:
      - ~/.aws:/root/.aws:ro
      - porchlight-data:/data
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
volumes:
  porchlight-data:

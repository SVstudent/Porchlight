<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1e2a2b"/></marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b8741a"/></marker>
  </defs>
  <rect width="1400" height="860" fill="#f3f1ec"/>
  <text x="40" y="52" font-size="30" font-weight="700" fill="#1e2a2b">Porchlight — architecture</text>
  <text x="40" y="78" font-size="15" fill="#5f6b6c">Neighbor check-in agent for community groups · built on the Strands Agents SDK · Amazon Bedrock · AgentCore Runtime</text>

  <!-- Feeds -->
  <rect x="40" y="120" width="260" height="250" rx="12" fill="#ffffff" stroke="#d9d5cc"/>
  <text x="60" y="150" font-size="13" font-weight="700" fill="#5f6b6c" letter-spacing="1">LIVE PUBLIC DATA (no keys)</text>
  <rect x="60" y="165" width="220" height="52" rx="8" fill="#dce8f0"/><text x="72" y="187" font-size="14" font-weight="600" fill="#1e2a2b">NWS alerts API</text><text x="72" y="206" font-size="12" fill="#5f6b6c">api.weather.gov · Extreme Heat Warning…</text>
  <rect x="60" y="225" width="220" height="52" rx="8" fill="#dce8f0"/><text x="72" y="247" font-size="14" font-weight="600" fill="#1e2a2b">Open-Meteo</text><text x="72" y="266" font-size="12" fill="#5f6b6c">feels-like °F, US AQI per member home</text>
  <rect x="60" y="285" width="220" height="52" rx="8" fill="#dce8f0"/><text x="72" y="307" font-size="14" font-weight="600" fill="#1e2a2b">OpenStreetMap Overpass</text><text x="72" y="326" font-size="12" fill="#5f6b6c">libraries &amp; community centres nearby</text>

  <!-- Sentinel -->
  <rect x="340" y="120" width="250" height="110" rx="12" fill="#ffffff" stroke="#3a6a8a" stroke-width="2"/>
  <text x="360" y="150" font-size="16" font-weight="700" fill="#1e2a2b">Sentinel scan (deterministic)</text>
  <text x="360" y="172" font-size="12" fill="#5f6b6c">APScheduler every 15 min · no LLM</text>
  <text x="360" y="190" font-size="12" fill="#5f6b6c">official alerts + thresholds (≥105 °F,</text>
  <text x="360" y="206" font-size="12" fill="#5f6b6c">AQI ≥151, ≤15 °F) · de-duplicated</text>
  <line x1="300" y1="245" x2="340" y2="175" stroke="#1e2a2b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Strands graph -->
  <rect x="340" y="260" width="740" height="330" rx="14" fill="#ffffff" stroke="#1e2a2b" stroke-width="2"/>
  <text x="360" y="290" font-size="16" font-weight="700" fill="#1e2a2b">Strands Agents SDK — GraphBuilder pipeline (one graph per episode)</text>
  <text x="360" y="308" font-size="12" fill="#5f6b6c">FileSessionManager persists messages + interrupt state · AuditHook streams every model/tool call · ApprovalGateHook interrupts gated tools</text>

  <g font-size="13">
    <rect x="360" y="330" width="130" height="86" rx="10" fill="#dce8f0" stroke="#3a6a8a"/><text x="372" y="352" font-weight="700" fill="#1e2a2b">assess</text><text x="372" y="370" fill="#5f6b6c">sentinel agent</text><text x="372" y="386" fill="#5f6b6c">structured output</text><text x="372" y="402" fill="#5f6b6c">HazardAssessment</text>
    <rect x="530" y="330" width="130" height="86" rx="10" fill="#f6e6c9" stroke="#b8741a"/><text x="542" y="352" font-weight="700" fill="#1e2a2b">triage</text><text x="542" y="370" fill="#5f6b6c">tiers 1-3 per</text><text x="542" y="386" fill="#5f6b6c">neighbor from risk</text><text x="542" y="402" fill="#5f6b6c">× live exposure</text>
    <rect x="700" y="330" width="130" height="86" rx="10" fill="#dcebe4" stroke="#2f6b5a"/><text x="712" y="352" font-weight="700" fill="#1e2a2b">outreach</text><text x="712" y="370" fill="#5f6b6c">per-member msgs</text><text x="712" y="386" fill="#5f6b6c">EN/ES + call script</text><text x="712" y="402" fill="#5f6b6c">dispatch_outreach ⏸</text>
    <rect x="700" y="440" width="130" height="86" rx="10" fill="#e8dff3" stroke="#6b4b9a"/><text x="712" y="462" font-weight="700" fill="#1e2a2b">logistics</text><text x="712" y="480" fill="#5f6b6c">volunteers ↔ needs</text><text x="712" y="496" fill="#5f6b6c">cooling centres</text><text x="712" y="512" fill="#5f6b6c">assign_volunteers ⏸</text>
    <rect x="890" y="385" width="150" height="86" rx="10" fill="#ebe8e1" stroke="#1e2a2b"/><text x="902" y="407" font-weight="700" fill="#1e2a2b">brief</text><text x="902" y="425" fill="#5f6b6c">plain-language</text><text x="902" y="441" fill="#5f6b6c">coordinator summary</text><text x="902" y="457" fill="#5f6b6c">record_coordinator_brief</text>
  </g>
  <line x1="490" y1="373" x2="530" y2="373" stroke="#1e2a2b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="493" y="364" font-size="10" fill="#5f6b6c">activate?</text>
  <line x1="660" y1="373" x2="700" y2="373" stroke="#1e2a2b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="660" y1="380" x2="700" y2="470" stroke="#1e2a2b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="830" y1="373" x2="890" y2="410" stroke="#1e2a2b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="830" y1="483" x2="890" y2="450" stroke="#1e2a2b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="465" y1="230" x2="425" y2="330" stroke="#1e2a2b" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="360" y="440" width="300" height="130" rx="10" fill="#fff7e8" stroke="#e39a2f"/>
  <text x="372" y="462" font-size="13" font-weight="700" fill="#7a4d0a">Tools (@tool)</text>
  <text x="372" y="482" font-size="12" fill="#1e2a2b">get_roster · get_member_conditions · get_area_conditions</text>
  <text x="372" y="500" font-size="12" fill="#1e2a2b">find_nearby_cooled_places · list_volunteers · list_resources</text>
  <text x="372" y="518" font-size="12" fill="#1e2a2b">get_checkin_status · submit_triage_plan</text>
  <text x="372" y="540" font-size="12" font-weight="600" fill="#7a4d0a">⏸ gated: dispatch_outreach · assign_volunteers · escalate_member</text>
  <text x="372" y="558" font-size="11" fill="#5f6b6c">gated = BeforeToolCallEvent → event.interrupt() → coordinator decides → resume</text>

  <!-- Follow-up agent -->
  <rect x="1110" y="260" width="250" height="140" rx="12" fill="#ffffff" stroke="#c8412b" stroke-width="2"/>
  <text x="1130" y="290" font-size="16" font-weight="700" fill="#1e2a2b">Follow-up agent</text>
  <text x="1130" y="310" font-size="12" fill="#5f6b6c">runs every 2 min while monitoring</text>
  <text x="1130" y="328" font-size="12" fill="#5f6b6c">reads check-ins · escalates tier-1</text>
  <text x="1130" y="346" font-size="12" fill="#5f6b6c">non-responders: volunteer visit,</text>
  <text x="1130" y="364" font-size="12" fill="#5f6b6c">emergency contact, or 911 advice</text>
  <text x="1130" y="386" font-size="12" font-weight="600" fill="#7a4d0a">policy can pre-authorise visits</text>
  <line x1="1080" y1="428" x2="1110" y2="330" stroke="#1e2a2b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Model -->
  <rect x="1110" y="430" width="250" height="160" rx="12" fill="#ffffff" stroke="#d9d5cc"/>
  <text x="1130" y="458" font-size="13" font-weight="700" fill="#5f6b6c" letter-spacing="1">MODEL (strands ModelRouter)</text>
  <text x="1130" y="482" font-size="14" font-weight="600" fill="#1e2a2b">1. Amazon Bedrock · Claude</text>
  <text x="1130" y="502" font-size="12" fill="#5f6b6c">BedrockModel(model_id, region)</text>
  <text x="1130" y="526" font-size="13" fill="#1e2a2b">2. Anthropic API (fallback)</text>
  <text x="1130" y="548" font-size="13" fill="#1e2a2b">3. Ollama local (offline dev)</text>
  <text x="1130" y="574" font-size="11" fill="#5f6b6c">FallbackStrategy · OpenTelemetry traces</text>

  <!-- API / storage -->
  <rect x="40" y="410" width="260" height="180" rx="12" fill="#ffffff" stroke="#d9d5cc"/>
  <text x="60" y="440" font-size="13" font-weight="700" fill="#5f6b6c" letter-spacing="1">BACKEND (FastAPI)</text>
  <text x="60" y="464" font-size="13" fill="#1e2a2b">REST + Server-Sent Events</text>
  <text x="60" y="484" font-size="13" fill="#1e2a2b">SQLite store (roster, episodes,</text>
  <text x="60" y="502" font-size="13" fill="#1e2a2b">approvals, check-ins)</text>
  <text x="60" y="524" font-size="13" fill="#1e2a2b">Channel registry: Twilio SMS,</text>
  <text x="60" y="542" font-size="13" fill="#1e2a2b">Telegram (two-way), Amazon SES</text>
  <text x="60" y="566" font-size="12" fill="#5f6b6c">.env stays in backend/ (never committed)</text>
  <line x1="300" y1="470" x2="340" y2="470" stroke="#1e2a2b" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arr)"/>

  <!-- Humans -->
  <rect x="40" y="630" width="420" height="190" rx="12" fill="#ffffff" stroke="#e39a2f" stroke-width="2"/>
  <text x="60" y="660" font-size="16" font-weight="700" fill="#1e2a2b">Coordinator desk (React + Vite)</text>
  <text x="60" y="684" font-size="13" fill="#1e2a2b">Live agent activity feed (SSE) · hazard + pipeline stepper</text>
  <text x="60" y="704" font-size="13" fill="#1e2a2b">Decision cards: edit messages, approve / decline</text>
  <text x="60" y="724" font-size="13" fill="#1e2a2b">Neighbor status tiles + Leaflet map · volunteer assignments</text>
  <text x="60" y="744" font-size="13" fill="#1e2a2b">Standing policy toggles · roster CSV import</text>
  <text x="60" y="776" font-size="12" font-weight="600" fill="#7a4d0a">The agents surface only when a human must decide.</text>
  <line x1="250" y1="590" x2="250" y2="630" stroke="#b8741a" stroke-width="2" marker-end="url(#arrA)" marker-start="url(#arrA)"/>

  <rect x="500" y="630" width="400" height="190" rx="12" fill="#ffffff" stroke="#2f6b5a" stroke-width="2"/>
  <text x="520" y="660" font-size="16" font-weight="700" fill="#1e2a2b">Neighbors &amp; volunteers</text>
  <text x="520" y="684" font-size="13" fill="#1e2a2b">Personal SMS / Telegram / email in their language</text>
  <text x="520" y="704" font-size="13" fill="#1e2a2b">One-tap check-in page: “I'm OK” / “I need help”</text>
  <text x="520" y="724" font-size="13" fill="#1e2a2b">Telegram replies (OK / HELP) captured automatically</text>
  <text x="520" y="744" font-size="13" fill="#1e2a2b">Volunteers get visit / ride / call requests</text>
  <text x="520" y="776" font-size="12" font-weight="600" fill="#2f6b5a">Replies feed the follow-up agent's next cycle.</text>
  <line x1="700" y1="590" x2="700" y2="630" stroke="#1e2a2b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="900" y1="700" x2="1110" y2="400" stroke="#2f6b5a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <!-- AgentCore -->
  <rect x="940" y="630" width="420" height="190" rx="12" fill="#ffffff" stroke="#d9d5cc"/>
  <text x="960" y="660" font-size="13" font-weight="700" fill="#5f6b6c" letter-spacing="1">DEPLOYMENT</text>
  <text x="960" y="684" font-size="14" font-weight="600" fill="#1e2a2b">Amazon Bedrock AgentCore Runtime</text>
  <text x="960" y="704" font-size="12" fill="#5f6b6c">backend/agentcore_app.py · BedrockAgentCoreApp entrypoint</text>
  <text x="960" y="722" font-size="12" fill="#5f6b6c">streams graph events; resume with interrupt responses</text>
  <text x="960" y="748" font-size="14" font-weight="600" fill="#1e2a2b">Docker Compose (backend + nginx frontend)</text>
  <text x="960" y="768" font-size="12" fill="#5f6b6c">local or any container host · IAM role or ~/.aws mounted</text>
  <text x="960" y="796" font-size="12" fill="#5f6b6c">Observability: strands[otel] → CloudWatch GenAI / OTLP</text>
</svg>

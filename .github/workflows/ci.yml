name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend · lint, audit, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt ruff==0.16.1 pip-audit
      - name: Lint (ruff, including bandit security rules)
        run: ruff check .
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
      - name: Imports
        run: python -c "import app.main, agentcore_app"
      - name: Test suites (no model provider, no AWS credentials)
        env:
          SEND_MODE: console
          SENTINEL_ENABLED: "false"
        run: |
          for t in tests/test_*.py; do
            m="${t%.py}"
            echo "::group::${m//\//.}"
            python -m "${m//\//.}"
            echo "::endgroup::"
          done

  frontend:
    name: Frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
